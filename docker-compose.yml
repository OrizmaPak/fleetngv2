services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: fleetng
      MYSQL_USER: fleetng
      MYSQL_PASSWORD: fleetng_local
      MYSQL_ROOT_PASSWORD: fleetng_root_local
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfleetng_root_local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  composer-cache:
  mysql-data:
